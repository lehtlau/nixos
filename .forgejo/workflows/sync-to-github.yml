name: Sync main to GitHub

on:
  # Cron has no "last X weekday of month" syntax, so this runs every Friday
  # and the check-date job decides whether to actually do anything.
  schedule:
    - cron: "0 3 * * 5" # every Friday at 03:00 UTC
  # Manual runs intentionally bypass the last-Friday restriction.
  workflow_dispatch: {}

jobs:
  check-date:
    runs-on: debian-latest
    outputs:
      is-last-friday: ${{ steps.check.outputs.is-last-friday }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          weekday=$(date -u -d "$today" +%u)
          next_week_month=$(date -u -d "$today +7 days" +%Y-%m)
          if [ "$weekday" = 5 ] && [ "$next_week_month" != "${today%-*}" ]; then
            echo "is-last-friday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-last-friday=false" >> "$GITHUB_OUTPUT"
            echo "Date check: $today is not the last Friday of the month (UTC)."
          fi

  sync:
    needs: check-date
    if: needs.check-date.outputs.is-last-friday == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: debian-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Squash main into github branch
        run: |
          set -euo pipefail

          git config user.name "forgejo-bot"
          git config user.email "forgejo-bot@remote"
          # build on top of GitHub's current main so the push is always a fast-forward
          if git fetch https://github.com/lehtlau/nixos.git main:github; then
            git checkout github
            # take main's tree as-is; a merge would conflict with the scrubbed files
            git read-tree -u --reset origin/main
          else
            git checkout --orphan github origin/main
          fi
          bash scripts/clean-user-info.sh
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "Sync from main ($(date +%Y-%m-%d))"
          fi

      # Scan the exact mirror tree after scrubbing and before exposing the key.
      # Full history contains an exposed credential; scan current files.
      - name: Scan public mirror for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        with:
          args: dir --redact --no-banner --config .gitleaks.toml .

      - name: Push to GitHub
        shell: bash
        env:
          SSH_KEY: ${{ secrets.GH_DEPLOY_KEY }}
          SYNC_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Scheduled jobs may have been queued, retried, or crossed midnight.
          # Recheck their date; manual runs are allowed on any day.
          if [ "$SYNC_EVENT_NAME" != "workflow_dispatch" ]; then
            today=$(date -u +%F)
            weekday=$(date -u -d "$today" +%u)
            next_week_month=$(date -u -d "$today +7 days" +%Y-%m)
            if [ "$weekday" != 5 ] || [ "$next_week_month" = "${today%-*}" ]; then
              echo "Skipping push: $today is not the last Friday of the month (UTC)."
              exit 0
            fi
          fi

          echo "::group::Deploy key"
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::GH_DEPLOY_KEY secret is empty or not available to this workflow"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # prints only the public fingerprint, compare it with the deploy key on GitHub
          if ! ssh-keygen -l -f ~/.ssh/id_ed25519; then
            echo "::error::GH_DEPLOY_KEY is not a valid private key (check for missing newlines / header lines)"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::known_hosts"
          if ! ssh-keyscan -H github.com >> ~/.ssh/known_hosts; then
            echo "::error::ssh-keyscan github.com failed; runner may lack outbound network/DNS or port 22 is blocked"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::SSH auth test"
          # github always exits 1 here, even on success, so judge by the output
          auth_out=$(ssh -T -o BatchMode=yes -i ~/.ssh/id_ed25519 git@github.com 2>&1 || true)
          echo "$auth_out"
          if ! grep -q "successfully authenticated" <<<"$auth_out"; then
            echo "::error::SSH authentication to GitHub failed"
            ssh -vT -o BatchMode=yes -i ~/.ssh/id_ed25519 git@github.com 2>&1 || true
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Refs"
          git log --oneline -n 3 github
          git remote add github git@github.com:lehtlau/nixos.git
          git ls-remote github refs/heads/main || echo "::warning::could not list remote main"
          echo "::endgroup::"

          if ! git push github github:main 2>&1 | tee push.log; then
            echo "::error::git push failed"
            if grep -qE "non-fast-forward|fetch first|rejected" push.log; then
              echo "::error::Remote main has commits not in the local github branch (history diverged)."
            elif grep -qiE "write access|permission|denied" push.log; then
              echo "::error::Deploy key lacks write access; enable 'Allow write access' on the GitHub deploy key."
            elif grep -qiE "protected branch|GH006" push.log; then
              echo "::error::GitHub branch protection rejected the push."
            fi
            echo "Retrying with verbose output:"
            GIT_TRACE=1 GIT_SSH_COMMAND="ssh -v" git push github github:main || true
            exit 1
          fi
